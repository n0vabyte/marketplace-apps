---
- name: Add addons
  import_role:
    name: addons
  when: add_ons != ['none']

- name: Copy MOTD template to /etc/motd
  template:
    src: motd.j2
    dest: /etc/motd
    mode: '0644'
    owner: root
    group: root

- name: Write credentials file
  copy:
    dest: "/home/{{ username }}/.credentials"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0600'
    content: |
      Sudo Username: {{ username }}
      Sudo Password: {{ password }}

      Discourse URL: https://{{ _domain }}/
      Discourse Admin Email: {{ admin_email }}
      Discourse Admin Password: {{ discourse_admin_password }}
      {% if smtp_address is defined and smtp_address | length > 0 %}

      Outbound email is configured via {{ smtp_address }}.
      {% else %}

      NOTE: no SMTP server was configured at deploy time, so Discourse cannot send
      password-reset, notification, or digest email. Configure one under
      Admin > Settings > Email, or redeploy with the SMTP UDFs set.
      {% endif %}
